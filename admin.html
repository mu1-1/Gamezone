<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameZone Admin</title><link rel="icon" type="image/jpeg" href="logo.jpg"><link rel="stylesheet" href="style.css"><style>.admin{min-height:100vh;padding:130px 8% 80px}.panel{max-width:850px;margin:auto;background:linear-gradient(150deg,#16263a,#080d15);border:1px solid rgba(18,168,255,.2);border-radius:22px;padding:30px}.admin h1{font-family:'Space Grotesk';font-size:45px}.admin h1 span{color:var(--blue)}input,select{width:100%;box-sizing:border-box;background:#08111d;border:1px solid rgba(255,255,255,.1);color:#fff;padding:12px;border-radius:9px;margin:7px 0 14px}.admin button{border:0;background:var(--blue);padding:12px 16px;border-radius:9px;font-weight:900;cursor:pointer}.order{margin-top:25px;border-top:1px solid rgba(255,255,255,.1);padding-top:22px}.line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px}.muted{color:#91a0b4;font-size:11px}.err{color:#ff8d8d;margin-top:10px}</style></head><body><main class="admin"><div class="panel"><p style="color:#67caff;font-size:9px;font-weight:900;letter-spacing:2px">GAMEZONE PRIVATE</p><h1>Admin <span>Orders</span></h1><section id="login"><p class="muted">Sign in with your private admin password.</p><input id="password" type="password" autocomplete="current-password" placeholder="Admin password"><button id="loginBtn">LOGIN</button><div id="loginErr" class="err"></div></section><section id="dashboard" hidden><div style="display:flex;gap:10px"><input id="invoice" placeholder="GZ-2026-000001"><button id="search">SEARCH</button></div><div id="result"></div></section></div></main><script src="admin.js"></script></body></html>
